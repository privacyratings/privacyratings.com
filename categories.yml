# Categories shown on the site, grouped and in this order.
#
# id           Folder name under ratings/ and the page URL. Never rename once published.
# type         app     = software people install. No automated server tests.
#              service = hosted service. Entries with a `domain` get automated tests.
# scans        Automated tests for entries in this category (see scripts/scan.js):
#              ssllabs, observatory, internetnl-web, internetnl-mail, hardenize
# seo_title    Optional <title> for the category page. h1: optional page heading.
# awesome      Section names in Awesome Privacy that import into this category.

- group: Email
  categories:
    - id: email-providers
      name: Email providers
      seo_title: "Private email providers: privacy ratings compared"
      h1: Email provider privacy ratings
      type: service
      description: Hosted email services. Where mail is stored, and who can read it.
      scans: [ssllabs, observatory, internetnl-web, internetnl-mail, mail, hardenize]
      awesome: [Encrypted Email]
    - id: email-forwarding
      name: Email forwarding and aliases
      seo_title: "Email alias and forwarding privacy ratings compared"
      h1: Email alias and forwarding privacy ratings
      type: service
      description: Services that hide a real address behind aliases or forward mail to another inbox.
      scans: [ssllabs, observatory, internetnl-web, internetnl-mail, mail, hardenize]
      awesome: [Mail Forwarding]
