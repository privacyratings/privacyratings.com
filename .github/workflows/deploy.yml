name: Deploy

# Builds the site and publishes it with GitHub Pages.
# Runs on every push to main, after each scheduled scan, and on demand.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Scan]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pages: read # configure-pages reads the Pages settings
    steps:
      # Always main, so a run started by the Scan workflow includes the results it just committed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Social images are rendered once and reused while the page content is unchanged. The deploy
      # has its own cache key prefix, so it only restores images that an earlier deploy rendered,
      # never ones saved by pull request or other workflow runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/og
          key: og-deploy-${{ hashFiles('scripts/og.js', 'assets/fonts/*') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            og-deploy-${{ hashFiles('scripts/og.js', 'assets/fonts/*') }}-
      - run: npm test
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
