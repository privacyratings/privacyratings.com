- slug: app-framework
  title: "Best cross-platform app framework: Tauri, Flutter, React Native and more, rated"
  h1: The best frameworks for desktop and mobile apps
  description: Cross-platform app frameworks compared on telemetry, open source, trackers and audits, including Tauri, Flutter, React Native, Expo, Electron, Capacitor and .NET MAUI.
  categories: [app-frameworks]
  limit: 25
  intro: |
    A cross-platform framework builds apps for Windows, macOS, Linux, Android and iOS from one codebase. Its tooling and SDKs end up in every app built with it, so telemetry in the framework can become telemetry in your app. Every framework below is rated on the same [public criteria](/criteria/): open source, trackers and telemetry, funding and independent audits.

    Our recommended stack is [Tauri](/app-frameworks/tauri/) with [Svelte](/web-frameworks/svelte/) and TypeScript. The Forward Email apps are an open example: one [Tauri, Svelte and TypeScript codebase](https://github.com/forwardemail/mail.forwardemail.net) ships the webmail and the desktop and mobile apps.
  faq:
    - q: What is the best framework for cross-platform apps?
      a: Tauri, used with Svelte and TypeScript, builds small desktop and mobile apps from one web codebase, uses the system web view instead of a bundled browser, has no telemetry and has a public independent audit. React Native and Flutter are the most common choices for mobile, but their tooling sends usage data by default in some setups.
    - q: Is Tauri better than Electron?
      a: Tauri apps are usually much smaller because they use the system web view instead of bundling Chromium, and Tauri also targets Android and iOS. Electron gives the same browser engine on every platform. See both ratings for the evidence.
    - q: Do Flutter and Expo collect telemetry?
      a: The Flutter and Expo command-line tools send usage data by default until it is turned off. Each rating links to the documentation that explains how to turn it off.
