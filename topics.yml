- slug: email-alias
  title: "Email alias services compared: hide your real address"
  h1: Email alias and forwarding services
  description: Email alias and forwarding services compared on privacy, open source, encryption, SRS, ARC and custom domains.
  categories: [email-forwarding]
  limit: 20
  intro: |
    Email aliases give each site its own address that forwards to your real inbox, so leaks and spam can be traced and switched off. Each service is rated on privacy, openness and correct forwarding (SRS and ARC).
  faq:
    - q: Why use an email alias?
      a: Aliases keep your real address private, show which site leaked or sold your address, and let you turn off an address without changing your inbox.

