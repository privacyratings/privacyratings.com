# Guides for common searches, such as "private email" or "no-log VPN".
# Each guide lists rated entries that match its filter, ranked by picks and then score,
# with an introduction and questions. Lists update automatically when ratings change.
#
# slug         Page URL: /<slug>/
# title        <title> and search result headline
# h1           Page heading
# description  Meta description
# intro        Markdown shown above the list
# categories   Categories to list entries from
# require      Criteria that must be answered yes (or the listed answers) to be included
# limit        Maximum entries listed
# faq          Questions and answers, also published as FAQPage structured data

- slug: private-email
  title: "Private email: the most private email services, rated"
  h1: The most private email services
  description: "Private email services compared by public evidence: encryption, open source, trackers, ads, audits, jurisdiction and live security tests."
  categories: [email-providers]
  require: { no_ads: [yes, partial] }
  limit: 20
  intro: |
    A private email service does not read, sell or advertise against your mail, keeps as little data as possible, and proves it with public code, audits and clear policies. Every service below is scored against the same [public criteria](/criteria/#email-providers), with a link to evidence for every answer and automated tests of its mail and web servers.

    Services funded by advertising are left out of this list. See [all email providers](/email-providers/) for the full comparison, including Gmail and Outlook.com.
  faq:
    - q: What is the most private email service?
      a: The most private services encrypt stored mail, publish their code, have no ads or trackers, and have been independently audited. The list above is ranked by those criteria, with our picks first. Check the evidence for the features you need.
    - q: Is Gmail private?
      a: Gmail scans mail for spam and security, uses account activity across Google services for advertising, and does not encrypt stored mail with a key only you hold. See the full Gmail rating and private alternatives to Gmail.
    - q: Does jurisdiction matter for private email?
      a: Jurisdiction decides which laws can compel a provider to hand over data. The data it can hand over depends mostly on what it stores and who holds the keys. Each rating shows the country, Eyes alliance membership and whether the CLOUD Act applies.

- slug: secure-email
  title: "Secure email: encrypted, audited email services compared"
  h1: The most secure email services
  description: Secure email services compared on end-to-end encryption, encrypted storage, independent audits, MTA-STS, DANE, DNSSEC and TLS test results.
  categories: [email-providers]
  require: { e2ee: [yes, partial] }
  limit: 20
  intro: |
    Secure email protects messages in transit and at rest, supports end-to-end encryption, and hardens its servers against interception. Each service below supports end-to-end encryption, and each page shows automated tests of TLS, MTA-STS, DANE, DNSSEC, SPF and DMARC along with evidence for every answer.
  faq:
    - q: What makes an email service secure?
      a: Look for end-to-end encryption such as OpenPGP, encrypted storage, enforced transport security (MTA-STS or DANE), DNSSEC, strong TLS, two-factor sign-in and a recent independent security audit. The criteria and tests behind each rating are public.
    - q: Is end-to-end encrypted email possible with any recipient?
      a: Only when both sides support the same system. OpenPGP works across providers and apps; some services use their own encryption between their own users and password-protected messages for everyone else.

- slug: encrypted-email
  title: "Encrypted email services compared: OpenPGP and end-to-end encryption"
  h1: Encrypted email services
  description: Email services that support end-to-end encryption and encrypted storage, rated with public evidence and security tests.
  categories: [email-providers, email-clients, webmail]
  require: { e2ee: [yes], openpgp: [yes] }
  limit: 30
  intro: |
    Encrypted email keeps message contents readable only by the sender and recipients. This list includes email services with end-to-end encryption and email apps with built-in OpenPGP, so you can pair a provider with a client.
  faq:
    - q: What is the difference between TLS and end-to-end encryption?
      a: TLS protects mail between servers and apps, but the provider can still read it. End-to-end encryption means only the people holding the keys can read the message.
    - q: Do I need a special provider for encrypted email?
      a: No. OpenPGP works with any provider through an app that supports it, such as the email clients in this list. Some providers also build encryption into their webmail and apps.

- slug: anonymous-email
  title: "Anonymous email: sign up without a phone number or personal data"
  h1: Anonymous email services
  description: Email services and aliases you can sign up for without a phone number or another email address, rated for privacy with evidence.
  categories: [email-providers, email-forwarding]
  require: { anonymous_signup: [yes] }
  limit: 25
  intro: |
    These services let you create an account without a phone number or an existing email address. Combine them with a VPN or Tor and anonymous payment for more privacy.
  faq:
    - q: Can email be completely anonymous?
      a: Sign-up can be, but metadata such as IP addresses, recipients and timing can still identify you. Use a VPN or Tor, pay anonymously, and avoid linking the account to your real identity.

