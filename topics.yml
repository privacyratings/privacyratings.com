  categories: [vpns]
  require: { no_logs_audited: [yes, partial] }
  limit: 20
  intro: |
    Most VPNs claim not to keep logs. This list includes only VPNs with a no-logs policy checked by an independent audit (yes) or at least published (partial), with the report linked on each page.
  faq:
    - q: Can a VPN see my traffic?
      a: Yes. A VPN sees where your traffic goes instead of your internet provider, which is why an audited no-logs policy, anonymous payment and open-source apps matter.

