- id: dnssec
  title: DNSSEC
  weight: 3
  question: Can DNSSEC be turned on for hosted zones?
  yes: One click or automatic.
  partial: Supported with manual steps.
  no: Not supported.
  why: DNSSEC stops attackers from forging a domain's records.
  verify: Link the documentation.

