- id: local_storage
  title: Data stays on device
  weight: 3
  question: Is cycle data stored only on the device by default?
  yes: Stored only on the device unless you choose to back it up.
  partial: Synced to a server but end-to-end encrypted.
  no: Stored on the vendor's servers in readable form.
  why: Cycle and pregnancy data can be requested by courts and police in some jurisdictions.
