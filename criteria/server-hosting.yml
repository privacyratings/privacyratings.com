- id: reverse_dns
  title: Reverse DNS
  weight: 1
  question: Can reverse DNS (PTR) records be set for IPv4 and IPv6?
  yes: Both, self-service.
  partial: On request, or IPv4 only.
  no: Not supported.
  why: Mail servers without matching reverse DNS are rejected as spam.
  verify: Link the documentation.

- id: ipv6
