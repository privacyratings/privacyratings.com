- id: e2ee_vault
  title: End-to-end encrypted vault
  weight: 3
  question: Is the vault encrypted on the device before it is synced, with a key the provider does not hold?
  yes: End-to-end encrypted, or local-only with no sync service.
  partial: Encrypted, but key handling is not documented.
  no: The provider can decrypt vaults.
  why: A breached password manager exposes every account.
  verify: Link the security whitepaper or encryption documentation.

- id: self_host_or_local
  title: Local or self-hosted option
  weight: 2
  question: Can the vault be kept locally or on your own server?
  yes: Local files or a supported self-hosted server.
  partial: Export only.
  no: Only the vendor's cloud.
  why: Keeping data under your control removes a third party.
  verify: Link the documentation.

- id: export
  title: Full export
  weight: 1
  question: Can every item be exported in an open format?
  yes: Full export in an open format.
  partial: Partial export.
  no: No export.
  why: Export prevents lock-in.
  verify: Link the export documentation.
