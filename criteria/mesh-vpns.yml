- id: device_keys
  title: Keys stay on devices
  weight: 3
  question: Is traffic encrypted between devices with private keys created on each device, so the coordination server and relays cannot read it?
  yes: Private keys are created on each device and never leave it. Relays only forward encrypted packets.
  partial: Traffic is encrypted between devices, but key handling is not documented, or some setups use keys created on the server.
  no: Traffic is decrypted on the vendor's servers.
  why: The coordination server knows every device on the network. Keys that stay on the devices keep it from reading the traffic too.
  verify: Link the security or architecture documentation that describes key generation and relays.

- id: self_hosted_control
  title: Self-hosted coordination server
  weight: 2
  question: Can the coordination or control server be self-hosted with open-source software?
  yes: The vendor's control server is open source and can be self-hosted, or the network needs no central server.
  partial: Self-hosting needs a proprietary or source-available server, is not officially supported, or works only through a third-party open-source replacement.
  no: Only the vendor's hosted service can be used.
  why: A self-hosted server keeps the list of devices, users and access rules off a third party's servers.
  verify: Link the self-hosting documentation and the server's license.

- id: no_connection_logs
  title: No connection logs by default
  weight: 2
  question: Are connection logs and client diagnostic logs kept off the vendor's servers unless a user or admin turns them on?
  yes: Nothing is sent to the vendor by default, or there is no vendor service.
  partial: Logs or crash reports are sent to the vendor by default, but can be turned off.
  no: Connection logs are kept by the vendor, with no documented way to turn them off.
  why: Connection logs show which devices talked to each other and when, even when the traffic itself is encrypted.
  verify: Link the logging, telemetry or data collection documentation.
